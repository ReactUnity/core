packages:
  # npm packages. Safe as a glob: Unity packages live under unity/, never here.
  - packages/*

  # React apps bundled inside the core Unity package. The .react dot-prefix is
  # what keeps Unity from importing them as assets.
  - unity/core/.react/*

  # React source of the full Unity sample project
  - full-sample/react

  - docs

  # Never members:
  #   packages/create/scaffold/** - a template for scaffolded projects. Its deps
  #     are placeholders, and its name (my-react-unity-ui) collides with
  #     samples/react/settings.
  #   **/Library/**, **/PackageCache/** - Unity's package cache is full of
  #     package.json files belonging to Unity's own packages.
  #   samples/react/** - rotted, and never members of the old npm workspace
  #     either. They declare react 19 alongside react-redux 8 / toolkit 1, which
  #     cap out at React 18. Adopt them once those are modernised.
  - '!samples/**'
  - '!packages/create/scaffold/**'
  - '!**/Library/**'
  - '!**/PackageCache/**'
  - '!**/node_modules/**'

# pnpm blocks dependency build scripts unless they are named here, one entry per
# package, `true` to run its scripts and `false` to skip them.
#
# This is `allowBuilds`, which supersedes pnpm 10's `onlyBuiltDependencies` list.
# pnpm 11 still accepts that key -- `pnpm config list` even echoes it back -- but no
# longer consults it, so every build script is skipped no matter what it names. pnpm 11
# also defaults `strictDepBuilds` to true, which turns a skipped build from a warning
# into ERR_PNPM_IGNORED_BUILDS and fails the install outright. Together those two
# changes broke every CI job at `pnpm install --frozen-lockfile` while local installs
# kept working off an already-built node_modules. (Verified on pnpm 11.17.0: with only
# `onlyBuiltDependencies: [esbuild]`, esbuild's postinstall does not run.)
#
# Hence: the packages that must build are `true`, and the ones deliberately not
# built are `false` rather than omitted -- omitting them leaves them "undecided",
# which is what strictDepBuilds errors on.
allowBuilds:
  # Must build, or their native/downloaded binaries never materialise:
  '@biomejs/biome': true # lint/format binary, used by every script in this repo
  esbuild: true # binary, pulled in by vite/tailwind
  '@parcel/watcher': true # native watcher used by tailwind + webpack --watch
  unrs-resolver: true # native resolver behind eslint-plugin-import

  # Install scripts only print funding banners:
  core-js: false
  core-js-pure: false
  es5-ext: false

# pnpm 11 refuses to install releases younger than its minimum-release-age window as a
# supply-chain measure, and writes an explicit exemption here when one is accepted
# anyway -- which is what happened for these three during the Astro migration. The
# entries are version-pinned, so they lapse on their own at the next bump; they exist so
# that `--frozen-lockfile` installs in CI resolve exactly as local ones do.
minimumReleaseAgeExclude:
  - '@astrojs/mdx@7.0.4'
  - astro@7.1.4
  - tegami@1.2.7
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
  - '@docsearch/core@4.7.0'
  - '@docsearch/css@4.7.0'
  - '@docsearch/react@4.7.0'
  - '@types/node@26.1.2'
  - postcss@8.5.24
  - webpack@5.109.1

# Force every request for a local package to resolve to the workspace copy.
#
# Without this, `pnpm install` reaches the registry for packages that exist right
# here: @reactunity/previewer stays an external dependency, and it peer-depends on
# @reactunity/scripts, so pnpm resolves that peer from npm at whatever version the
# workspace reports. That silently downloaded a registry copy of @reactunity/scripts
# while the local one sat next to it -- and it breaks outright the moment the local
# version is one the registry has never seen, which is exactly what aligning
# everything on an unreleased 0.22.0 does:
#
#   ERR_PNPM_NO_MATCHING_VERSION  No matching version found for
#   @reactunity/scripts@0.22.0 ... The latest release is "0.21.0".
overrides:
  '@reactunity/renderer': workspace:*
  '@reactunity/scripts': workspace:*
  '@reactunity/material': workspace:*
  '@reactunity/create': workspace:*
